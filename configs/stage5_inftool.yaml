# Stage 5: InfTool Closed Loop
# Multi-agent role-play: User Simulator, Tool-Calling Assistant, MCP Server

extends: base.yaml

stage: 5
name: "inftool_closed_loop"

training:
  # Closed-loop synthesis
  synthesis_batch_size: 32
  synthesis_temperature: 1.0
  max_synthesis_iterations: 1000
  
  # GRPO with gated rewards
  use_gated_rewards: true
  gate_threshold: 0.7  # Only train on high-quality synthetic data

agents:
  user_simulator:
    model: "checkpoints/stage4_rlvr/instruct"
    temperature: 0.8
    max_tokens: 512
    
  tool_calling_assistant:
    model: "checkpoints/stage4_rlvr/instruct"
    temperature: 1.0
    max_tokens: 2048
    
  mcp_server:
    # Simulated MCP server responses
    response_delay: 0.1
    error_rate: 0.05

synthesis:
  # Data generation
  scenarios:
    - "code_editing"
    - "api_calling"
    - "test_generation"
    - "bug_fixing"
    - "refactoring"
    
  # Quality gates
  min_verifier_score: 0.7
  min_diversity_score: 0.5
  
  # Feedback loop
  feedback_to_stages: [2, 3, 4]  # Feed back to SFT, DPO, RLVR

output:
  synthetic_data_dir: "data/synthetic/inftool"
  quality_metrics: "logs/stage5_quality.jsonl"

